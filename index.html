<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="author" content="Conner Pohl Instruction" />

    <!-- Preload the LCP image so it starts downloading before the bundle parses -->
    <link
      rel="preload"
      href="/hero_header.webp"
      as="image"
      type="image/webp"
      media="(min-width: 769px)"
      fetchpriority="high"
    />

    <!-- Font optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the two families the stylesheets actually reference. Inter was
         also requested here but is never used in any `font-family` rule. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- DNS prefetch for external domains -->
    <link rel="dns-prefetch" href="//connerpohlinstruction-booking.as.me" />
    <link rel="dns-prefetch" href="//www.google.com" />
    <link rel="dns-prefetch" href="//www.facebook.com" />
    <link rel="dns-prefetch" href="//www.instagram.com" />

    <!--
      Everything between the markers below is replaced per route at build time
      by plugins/seoStatic.ts, which writes one HTML file per route. What is
      here is the dev-server fallback only — page titles, descriptions, and
      structured data are edited in src/seo/routes.ts, never in this file.
    -->
    <!--seo:start-->
    <title>Baseball Lessons in Troy, OH | Conner Pohl Instruction</title>
    <meta
      name="description"
      content="Private baseball hitting and fielding instruction in Troy, Ohio. Conner Pohl works one-on-one with players of every age to build a repeatable, confident swing."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://connerpohlinstruction.com/" />
    <!--seo:end-->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
